<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>String Manipulation &amp; Wrapper Classes Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0ebf8;font-family:Roboto,Arial,Helvetica,sans-serif;color:#202124;font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid #dadce0;border-radius:8px;padding:22px 24px;margin-bottom:12px}
.title{border-top:10px solid #673ab7;padding-top:18px}
.title h1{margin:0 0 10px;font-size:26px;font-weight:400}
.title p{margin:0;color:#202124;line-height:1.5}
.req{color:#d93025;font-size:13px;margin-top:14px;border-top:1px solid #dadce0;padding-top:12px}
.q{font-size:16px;line-height:1.5;margin:0 0 14px}
.q span.s{color:#d93025}
pre{background:#f1f3f4;padding:10px;border-radius:4px;overflow-x:auto;font-size:13px;margin:0 0 14px}
label.o{display:flex;align-items:center;gap:14px;padding:8px 4px;cursor:pointer;font-size:14px}
label.o input{width:18px;height:18px;accent-color:#673ab7;margin:0;flex:none}
.card.err{border-color:#d93025}
.msg{color:#d93025;font-size:12px;margin-top:8px;display:none}
.err .msg{display:block}
.btns{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
button{background:#673ab7;color:#fff;border:0;border-radius:4px;padding:10px 24px;font-size:14px;font-weight:500;cursor:pointer}
button.clear{background:none;color:#673ab7}
.score{font-size:34px;margin:8px 0}
.ok{color:#188038;font-weight:500}.bad{color:#d93025;font-weight:500}
.ans{font-size:13px;margin-top:10px;line-height:1.5}
.foot{text-align:center;color:#70757a;font-size:12px;margin:18px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var Q=[
{q:"Which of these classes is immutable in Java?",o:["StringBuilder","StringBuffer","String","ArrayList"],a:2,e:"A String object cannot be changed after creation; every change makes a new object."},
{q:"What does this print?",c:'String s = "programming";\nSystem.out.println(s.substring(3, 7));',o:["gram","ogra","gramm","ramm"],a:0,e:"substring(3, 7) takes index 3 up to (not including) 7, giving \"gram\"."},
{q:"Which method compares the actual content of two strings?",o:["==","equals()","compare()","same()"],a:1,e:"== compares references; equals() compares the characters."},
{q:"Which is the wrapper class of the primitive type int?",o:["Int","Number","Integer","Integral"],a:2,e:"int → Integer, char → Character, double → Double."},
{q:"What is autoboxing?",o:["Converting a wrapper object to a primitive automatically","Converting a primitive to its wrapper object automatically","Converting a String to a char array","Converting int to double"],a:1,e:"Integer x = 5; is autoboxing. The reverse (int y = x;) is unboxing."},
{q:"What does Integer.parseInt(\"25\") + 5 evaluate to?",o:["\"255\"","30","255","Compile error"],a:1,e:"parseInt converts the String \"25\" to the int 25, so 25 + 5 = 30."}
];
var app=document.getElementById("app");
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function form(){
  var h='<div class="card title"><h1>String Manipulation &amp; Wrapper Classes Quiz</h1><p>Object-Oriented Programming. Choose one answer for each question, then press Submit to see your score.</p><div class="req">* Indicates required question</div></div>';
  Q.forEach(function(x,i){
    h+='<div class="card" id="c'+i+'"><p class="q">'+(i+1)+'. '+esc(x.q)+' <span class="s">*</span></p>';
    if(x.c)h+='<pre>'+esc(x.c)+'</pre>';
    x.o.forEach(function(t,k){h+='<label class="o"><input type="radio" name="q'+i+'" value="'+k+'"> '+esc(t)+'</label>'});
    h+='<div class="msg">This is a required question</div></div>';
  });
  h+='<div class="btns"><button id="sub">Submit</button><button class="clear" id="clr">Clear form</button></div><div class="foot">Never submit passwords through this form.</div>';
  app.innerHTML=h;
  document.getElementById("sub").onclick=submit;
  document.getElementById("clr").onclick=form;
}
function submit(){
  var ans=[],miss=false,first=null;
  Q.forEach(function(x,i){
    var r=document.querySelector('input[name=q'+i+']:checked'),c=document.getElementById("c"+i);
    if(r){ans.push(+r.value);c.classList.remove("err")}else{ans.push(-1);miss=true;c.classList.add("err");if(!first)first=c}
  });
  if(miss){first.scrollIntoView({behavior:"smooth",block:"center"});return}
  var sc=0,h='';
  Q.forEach(function(x,i){if(ans[i]===x.a)sc++});
  h+='<div class="card title"><h1>String Manipulation &amp; Wrapper Classes Quiz</h1><p>Your response has been recorded.</p><div class="score">'+sc+' / '+Q.length+'</div><p>'+(sc===6?"Perfect score!":sc>=4?"Well done!":"Keep practising!")+'</p></div>';
  Q.forEach(function(x,i){
    var good=ans[i]===x.a;
    h+='<div class="card"><p class="q">'+(i+1)+'. '+esc(x.q)+'</p>'+(x.c?'<pre>'+esc(x.c)+'</pre>':'')+
    '<div class="ans">Your answer: <span class="'+(good?'ok':'bad')+'">'+esc(x.o[ans[i]])+(good?' ✓':' ✗')+'</span>'+
    (good?'':'<br>Correct answer: <span class="ok">'+esc(x.o[x.a])+'</span>')+'<br><span style="color:#5f6368">'+esc(x.e)+'</span></div></div>';
  });
  h+='<div class="btns"><button id="again">Submit another response</button></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("again").onclick=function(){form();window.scrollTo(0,0)};
}
form();
</script>
</body>
</html>
