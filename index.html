<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz: String Manipulation &amp; Wrapper Classes</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5ec;--card:#fff;--ink:#18202f;--mut:#5b6470;--acc:#c8e86a;--line:#dfe3d2;--ok:#2e7d32;--bad:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--card:#1b2436;--ink:#eef1f6;--mut:#a3adbd;--line:#2c3750;--ok:#7bd88f;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#121826;--card:#1b2436;--ink:#eef1f6;--mut:#a3adbd;--line:#2c3750;--ok:#7bd88f;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.head{background:#18202f;color:#fff;border-radius:12px;padding:16px;border-right:10px solid var(--acc)}
.head small{color:var(--acc);letter-spacing:.08em;font-weight:700;font-size:11px}
.head h1{margin:4px 0 0;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:16px;margin-top:14px}
.prog{font-size:13px;color:var(--mut);margin-bottom:6px}
.q{font-weight:700;font-size:17px;margin:0 0 12px}
pre{background:#18202f;color:#c8e86a;padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;margin:0 0 12px}
button.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;cursor:pointer}
button.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
button.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.exp{font-size:14px;color:var(--mut);margin-top:8px}
.next{margin-top:12px;padding:12px 18px;border:0;border-radius:8px;background:var(--acc);color:#18202f;font-weight:700;font-size:15px;cursor:pointer}
.score{font-size:44px;font-weight:800;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><small>OBJECT-ORIENTED PROGRAMMING</small><h1>String Manipulation &amp; Wrapper Classes</h1></div>
  <div class="card" id="box"></div>
</div>
<script>
var Q=[
{q:"Which of these classes is immutable in Java?",o:["StringBuilder","StringBuffer","String","ArrayList"],a:2,e:"A String object cannot be changed after creation; every change makes a new object."},
{q:"What does this print?",c:'String s = "programming";\nSystem.out.println(s.substring(3, 7));',o:["gram","ogra","gramm","ramm"],a:0,e:"substring(3, 7) takes index 3 up to (not including) 7, giving \"gram\"."},
{q:"Which method compares the actual content of two strings?",o:["==","equals()","compare()","this.same()"],a:1,e:"== compares references; equals() compares the characters."},
{q:"Which is the wrapper class of the primitive type int?",o:["Int","Number","Integer","Integral"],a:2,e:"Every primitive has a wrapper: int → Integer, char → Character, double → Double."},
{q:"What is autoboxing?",o:["Converting a wrapper object to a primitive automatically","Converting a primitive to its wrapper object automatically","Converting a String to a char array","Converting int to double"],a:1,e:"Integer x = 5; is autoboxing. The reverse (int y = x;) is unboxing."},
{q:"What does Integer.parseInt(\"25\") + 5 evaluate to?",o:["\"255\"","30","255","Compile error"],a:1,e:"parseInt converts the String \"25\" to the int 25, so 25 + 5 = 30."}
];
var i=0,score=0,done=false,box=document.getElementById("box");
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function show(){
  var x=Q[i];done=false;
  var h='<div class="prog">Question '+(i+1)+' of '+Q.length+'</div><p class="q">'+esc(x.q)+'</p>';
  if(x.c)h+='<pre>'+esc(x.c)+'</pre>';
  x.o.forEach(function(t,k){h+='<button class="opt" data-k="'+k+'">'+esc(t)+'</button>'});
  h+='<div id="fb"></div>';
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}});
}
function pick(k){
  if(done)return;done=true;
  var x=Q[i],bs=box.querySelectorAll(".opt");
  if(k===x.a)score++;else bs[k].classList.add("bad");
  bs[x.a].classList.add("ok");
  var last=i===Q.length-1;
  document.getElementById("fb").innerHTML='<div class="exp">'+esc(x.e)+'</div><button class="next" id="nx">'+(last?"View score":"Next")+'</button>';
  document.getElementById("nx").onclick=function(){if(last)end();else{i++;show()}};
}
function end(){
  var m=score===6?"Perfect!":score>=4?"Well done!":"Keep practising!";
  box.innerHTML='<div class="prog">Your score</div><div class="score">'+score+' / '+Q.length+'</div><p class="q">'+m+'</p><button class="next" id="rs">Try again</button>';
  document.getElementById("rs").onclick=function(){i=0;score=0;show()};
}
show();
</script>
</body>
</html>
